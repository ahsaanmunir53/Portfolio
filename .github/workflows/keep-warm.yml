# Render's free plan puts the portfolio to sleep after 15 minutes without visitors, and the next
# visitor then waits about a minute on Render's loading page. This pings it every 10 minutes on
# weekdays from 01:00 to 09:00 UTC (09:00-17:00 Singapore, 06:00-14:00 Pakistan), about 190 hours
# a month of Render's 750 free hours per workspace. Disable it when you do not need it.
#
# Set the repository variable SITE_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://ahsaan-portfolio.onrender.com
name: Keep portfolio warm

on:
  schedule:
    - cron: "*/10 1-8 * * 1-5"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.SITE_URL }}/healthz" > /dev/null || true
