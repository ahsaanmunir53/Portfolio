# Render's free plan puts the portfolio to sleep after 15 minutes without visitors, and the next
# visitor then waits about a minute on Render's loading page. This pings it every 10 minutes from
# 01:00 to 18:59 UTC (06:00 to 23:59 Pakistan, 09:00 to 02:59 Singapore), every day.
#
# Cost: about 18 hours a day, roughly 560 of Render's 750 free instance hours a month, shared by the
# whole workspace. The other apps sleep most of the day, so they fit in the rest. If the workspace
# ever runs short, narrow the hours in the cron line below.
#
# The address can be changed with the repository variable SITE_URL
# (Settings -> Secrets and variables -> Actions -> Variables).
name: Keep portfolio warm

on:
  schedule:
    - cron: "*/10 1-18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.SITE_URL || 'https://ahsaan-portfolio.onrender.com' }}/healthz" > /dev/null || true
